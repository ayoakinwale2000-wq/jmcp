services:
  - type: web
    name: acme-mcp-test-harness
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/acme_mcp.sqlite3
